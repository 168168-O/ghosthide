name: Build GhostHide.tipa

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Build
        run: make

      - name: Upload .tipa
        uses: actions/upload-artifact@v4
        with:
          name: GhostHide-tipa
          path: GhostHide.tipa
