name: Build GhostHide.tipa

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # macos 机器池很紧张，同时向多个池排队，哪个先拿到机器用哪个
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Build
        run: make

      - name: Verify package layout
        run: |
          unzip -l GhostHide.ipa | head -20
          tar -tf GhostHide.tipa | head -10

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: GhostHide-tipa-${{ matrix.os }}
          path: |
            GhostHide.ipa
            GhostHide.tipa
