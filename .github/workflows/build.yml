name: Build GhostHide.tipa

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Build
        run: make

      - name: Verify package layout
        run: |
          unzip -l GhostHide.ipa | head -20
          tar -tf GhostHide.tipa | head -10

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: GhostHide-tipa
          path: |
            GhostHide.ipa
            GhostHide.tipa
